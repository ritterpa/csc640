# NGINX site for the Stage 1 API.
# Copy to /etc/nginx/sites-available/, symlink into sites-enabled/,
# adjust root and the PHP-FPM socket, then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8080;
    server_name localhost;

    # Absolute path to code/stage1/public
    root /var/www/csc640/code/stage1/public;
    index index.html;

    # Real files (index.html, assets/) are served directly; everything
    # else, including all /api/ requests, goes to the front controller.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        # Make sure the bearer token reaches PHP.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        # Match your PHP version, e.g. php8.3-fpm.sock
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Never serve dotfiles such as .env.
    location ~ /\. {
        deny all;
    }
}
